name: transcribe

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Masukkan URL video'
        required: true
        type: string
      nama_video:
        description: 'Nama file video (contoh: video)'
        required: true
        type: string
      nama_model:
        description: 'Pilih model Whisper'
        required: true
        type: choice
        default: "base.en"
        options:
          - tiny
          - tiny.en
          - base
          - base.en
          - small
          - small.en
          - medium
          - medium.en
          - medium-q8_0
          - large-v3-turbo-q8_0
      send_to_telegram:
        description: "Whatever send to telegram ci channel or not"
        required: true
        type: choice
        default: "true"
        options:
          - "true"
          - "false"
      send_to_github:
        description: "send to github realese or not"
        required: true
        type: choice
        default: "false"
        options:
          - "true"
          - "false"

jobs:
  transcribe:
    runs-on: ubuntu-22.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg cmake git python3-pip
          pip install -U yt-dlp

      - name: Clone whisper.cpp
        run: |
          git clone https://github.com/andromaxdroid/whisper.cpp kernel --depth 1

      - name: Download video & convert to wav
        run: |
          cd kernel
          VIDEO="${{ github.event.inputs.video_url }}"
          if [[ "$VIDEO" == *.mp4 ]]; then
            curl -L "${{ github.event.inputs.video_url }}" -o "${{ github.event.inputs.nama_video }}".mp4
          else
            yt-dlp -f worst "${{ github.event.inputs.video_url }}" -o "${{ github.event.inputs.nama_video }}".mp4
          fi
          ffmpeg -y -i "${{ github.event.inputs.nama_video }}".mp4 \
            -ar 16000 -ac 1 -c:a pcm_s16le audio.wav

      - name: Download model
        run: |
          cd kernel
          sh ./models/download-ggml-model.sh "${{ github.event.inputs.nama_model }}"

      - name: Build whisper.cpp
        run: |
          cd kernel
          cmake -B build
          cmake --build build -j --config Release
          
      - name: Set start time
        run: echo "START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Transcribe to SRT
        run: |
          cd kernel
          ./build/bin/whisper-cli \
            -f audio.wav \
            -m models/ggml-${{ github.event.inputs.nama_model }}.bin \
            -l en \
            -osrt
            
      - name: Calculate duration
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "DURATION_SECONDS=$DURATION" >> $GITHUB_ENV
      
      - name: Format duration
        run: |
          H=$((DURATION_SECONDS / 3600))
          M=$((DURATION_SECONDS / 60))
          S=$((DURATION_SECONDS % 60))
          echo "DURATION_FORMAT=${H}h ${M}m ${S}s" >> $GITHUB_ENV
            
      - name: Format build date
        run: |
          TZ=Asia/Jakarta date '+%d-%m-%Y %H:%M:%S WIB'
          echo "BUILD_DATE=$(TZ=Asia/Jakarta date '+%d-%m-%Y %H:%M:%S WIB')" >> $GITHUB_ENV
            
      - name: mv
        run: |
          cd kernel
          mv *.srt  "${{ github.event.inputs.nama_video }}".srt

      - name: Generate tag
        id: tag
        run: |
          echo "TAG=auto-$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Upload SRT to TELEGRAM
        uses: xz-dev/TelegramFileUploader@v1.1.1
        if: ${{ always() && github.event.inputs.send_to_telegram == 'true' }}
        with:
          to-who: '${{ secrets.TELEGRAM_API_TO_WHO }}'
          message: |
            #whisper.cpp #Andromax

            ⚙️ **Build Infomation:**
            - build succesfuly by **Whisper.cpp**
            
            - subtitle name : ${{ github.event.inputs.nama_video }}.srt
            
            - whisper model : 📊 **${{ github.event.inputs.nama_model }}**
            
            - Build Duration : 🕐 **${{ env.DURATION_FORMAT }}**
            
            - date : 📅 **${{ env.BUILD_DATE }}**
          files: kernel/${{ github.event.inputs.nama_video }}.srt
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          
      - name: Upload SRT to Release
        uses: softprops/action-gh-release@v1
        if: ${{ always() && github.event.inputs.send_to_github == 'true' }}
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          name: "Transcription ${{ steps.tag.outputs.TAG }}"
          files: kernel/*.srt
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
